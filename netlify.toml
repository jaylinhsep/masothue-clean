[build]
  command = "echo 'Build ready for Netlify'"
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/**"]

# Redirect all dynamic routes (SSR, APIs, Sitemaps) to serverless function
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
